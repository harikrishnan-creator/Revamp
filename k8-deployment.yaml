apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-index-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-index-app

  template:
    metadata:
      labels:
        app: my-index-app

    spec:
      containers:
        - name: my-index-app
          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 8081
