apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-jenkins-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-jenkins-app

  template:
    metadata:
      labels:
        app: my-jenkins-app

    spec:
      containers:
        - name: mmy-jenkins-app
          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 8001
